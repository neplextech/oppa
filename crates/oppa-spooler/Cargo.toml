[package]
name = "oppa-spooler"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Bounded raw TCP, system queue, and virtual printer submission for OPPA"
readme = "README.md"

[dependencies]
async-trait = "0.1.91"
oppa-core = { path = "../oppa-core" }
oppa-printer = { path = "../oppa-printer" }
oppa-renderer = { path = "../oppa-renderer" }
thiserror = "2.0.19"
tokio = { version = "1.53.1", features = ["io-util", "net", "process", "sync", "time"] }
tokio-util = { version = "0.7.17", features = ["rt"] }
uuid = { version = "1.24.0", features = ["v4"] }

[dev-dependencies]
oppa-protocol = { path = "../oppa-protocol" }
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread"] }
