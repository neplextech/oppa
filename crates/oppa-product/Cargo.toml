[package]
name = "oppa-product"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Compile-time validated product configuration for branded OPPA builds"
readme = "README.md"
build = "build.rs"

[features]
default = ["virtual-printer", "system-printer-discovery", "network-printer-discovery"]
virtual-printer = []
system-printer-discovery = []
network-printer-discovery = []

[dependencies]
oppa-core = { path = "../oppa-core" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.145"
thiserror = "2.0.19"
url = { version = "2.5.8", features = ["serde"] }

[build-dependencies]
oppa-core = { path = "../oppa-core" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.145"
url = { version = "2.5.8", features = ["serde"] }

[dev-dependencies]
tempfile = "3.23.0"
