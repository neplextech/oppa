[package]
name = "tauri-plugin-oppa-mobile"
version.workspace = true
description = "Minimal Android and iOS runtime bridge for the OPPA Tauri host"
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
links = "tauri-plugin-oppa-mobile"
readme = "README.md"

[dependencies]
async-trait.workspace = true
oppa-platform = { path = "../../../../crates/oppa-platform" }
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2" }
thiserror.workspace = true
tokio = { workspace = true }

[build-dependencies]
tauri-plugin = { version = "2.6.3", features = ["build"] }

# The Swift binding generated by `tauri::ios_plugin_binding!` declares an
# `extern` block, so this crate cannot inherit the workspace-wide `forbid`.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
