[package]
name = "oppa"
version.workspace = true
description = "OPPA desktop printer agent"
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
name = "oppa_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
async-trait.workspace = true
chrono.workspace = true
oppa-agent = { path = "../../../crates/oppa-agent" }
oppa-auth = { path = "../../../crates/oppa-auth" }
oppa-core = { path = "../../../crates/oppa-core" }
oppa-discovery = { path = "../../../crates/oppa-discovery" }
oppa-platform = { path = "../../../crates/oppa-platform" }
oppa-printer = { path = "../../../crates/oppa-printer" }
oppa-product = { path = "../../../crates/oppa-product" }
oppa-protocol = { path = "../../../crates/oppa-protocol" }
oppa-renderer = { path = "../../../crates/oppa-renderer" }
oppa-spooler = { path = "../../../crates/oppa-spooler" }
oppa-storage = { path = "../../../crates/oppa-storage" }
oppa-transport = { path = "../../../crates/oppa-transport" }
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
tauri-plugin-process = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
thiserror.workspace = true
tokio.workspace = true
tokio-util = { version = "0.7.17", features = ["rt"] }
url.workspace = true
uuid.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
