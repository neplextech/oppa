name: npm package checks

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'packages/**'
      - 'protocol/**'
      - 'eslint.config.js'
      - 'tsconfig.base.json'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
  pull_request:
    branches:
      - main
    paths:
      - 'packages/**'
      - 'protocol/**'
      - 'eslint.config.js'
      - 'tsconfig.base.json'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, test, and build packages
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build protocol package
        run: pnpm --filter @openprinter/protocol build

      - name: Lint packages
        run: pnpm exec eslint packages --max-warnings=0

      - name: Check protocol package
        run: pnpm --filter @openprinter/protocol check

      - name: Check server package
        run: pnpm --filter @openprinter/server check

      - name: Build packages
        run: pnpm --filter './packages/**' run build
