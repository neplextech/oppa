name: OPPA platform builds

on:
  pull_request:
    paths:
      - 'apps/oppa/**'
      - 'crates/**'
      - 'products/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'package.json'
      - 'pnpm-lock.yaml'
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        platform:
          - macos-latest
          - ubuntu-24.04
          - windows-latest
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v6
      - name: Install Tauri Linux dependencies
        if: matrix.platform == 'ubuntu-24.04'
        run: >-
          sudo apt-get update &&
          sudo apt-get install -y
          libwebkit2gtk-4.1-dev
          libappindicator3-dev
          librsvg2-dev
          patchelf
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: pnpm install --frozen-lockfile
      - name: Compile OPPA without signing
        uses: tauri-apps/tauri-action@v1
        env:
          OPPA_PRODUCT_DIR: ${{ github.workspace }}/products/default
        with:
          projectPath: apps/oppa
          args: --no-bundle
