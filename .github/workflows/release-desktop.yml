name: Release OPPA

on:
  workflow_dispatch:
  push:
    branches:
      - release
    paths:
      - 'apps/oppa/**'
      - 'crates/**'
      - 'products/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/release-desktop.yml'
      - '.github/scripts/check-desktop-release*'
      - '.github/scripts/android-update-manifest*'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preflight:
    name: Verify desktop release version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: Test release version guards
        run: node --test .github/scripts/check-desktop-release.test.mjs .github/scripts/android-update-manifest.test.mjs
      - name: Refuse published release versions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node .github/scripts/check-desktop-release.mjs

  release:
    needs: preflight
    name: Release (${{ matrix.name }})
    permissions:
      contents: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS ARM
            runner: macos-latest
            args: --target aarch64-apple-darwin
            rust-targets: aarch64-apple-darwin
          - name: macOS x64
            runner: macos-latest
            args: --target x86_64-apple-darwin
            rust-targets: x86_64-apple-darwin
          - name: Linux x64
            runner: ubuntu-22.04
            args: ''
            rust-targets: ''
          - name: Linux ARM
            runner: ubuntu-22.04-arm
            args: ''
            rust-targets: ''
          - name: Windows x64
            runner: windows-2022
            args: ''
            rust-targets: ''
          - name: Windows ARM
            runner: windows-11-arm
            args: ''
            rust-targets: ''

    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
          cache-on-failure: true
          shared-key: oppa-release-${{ matrix.name }}

      - name: Install Tauri Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            xdg-utils

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and upload stable release draft
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPPA_PRODUCT_DIR: ${{ github.workspace }}/products/default
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.OPPA_TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.OPPA_TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/oppa
          tagName: oppa-v__VERSION__
          releaseName: OPPA v__VERSION__
          releaseBody: See the attached assets to download and install this version of OPPA.
          releaseDraft: true
          prerelease: false
          updaterJsonPreferNsis: true
          args: ${{ matrix.args }}

  android:
    # Builds the signed direct-download APK and attaches it, with the
    # `latest-android.json` update manifest, to the draft created above.
    # Signing material only exists in repository secrets and the runner's
    # temporary directory; it is never written into the workspace.
    needs: release
    name: Release (Android APK)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
          cache-on-failure: true
          shared-key: oppa-release-android

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.OPPA_ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.OPPA_ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.OPPA_ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.OPPA_ANDROID_KEY_PASSWORD }}
        run: |
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Android release signing secret ${name} is not configured."
              exit 1
            fi
          done
          signing_dir="${RUNNER_TEMP}/oppa-android-signing"
          mkdir -p "${signing_dir}"
          chmod 700 "${signing_dir}"
          printf '%s' "${KEYSTORE_BASE64}" | base64 --decode > "${signing_dir}/release.jks"
          {
            echo "storeFile=${signing_dir}/release.jks"
            echo "storePassword=${KEYSTORE_PASSWORD}"
            echo "keyAlias=${KEY_ALIAS}"
            echo "keyPassword=${KEY_PASSWORD}"
          } > "${signing_dir}/signing.properties"
          chmod 600 "${signing_dir}/release.jks" "${signing_dir}/signing.properties"
          echo "OPPA_ANDROID_SIGNING_PROPERTIES=${signing_dir}/signing.properties" >> "${GITHUB_ENV}"

      - name: Build signed universal APK
        env:
          OPPA_PRODUCT_DIR: ${{ github.workspace }}/products/default
          OPPA_ANDROID_REQUIRE_SIGNING: 'true'
        run: |
          export NDK_HOME="${ANDROID_NDK_LATEST_HOME}"
          node apps/oppa/scripts/run-tauri.mjs android build --apk --target aarch64 armv7 x86_64

      - name: Verify the stable signing identity
        env:
          EXPECTED_CERT_SHA256: ${{ secrets.OPPA_ANDROID_CERT_SHA256 }}
        run: |
          apk="apps/oppa/src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release.apk"
          apksigner="$(ls -d "${ANDROID_HOME}"/build-tools/*/ | sort -V | tail -1)apksigner"
          "${apksigner}" verify --verbose --print-certs "${apk}" | tee "${RUNNER_TEMP}/apksigner.txt"
          if [ -n "${EXPECTED_CERT_SHA256}" ]; then
            expected="$(echo "${EXPECTED_CERT_SHA256}" | tr -d ':' | tr 'A-F' 'a-f')"
            grep -qi "certificate SHA-256 digest: ${expected}" "${RUNNER_TEMP}/apksigner.txt" || {
              echo "::error::The APK is not signed with the pinned OPPA release certificate."
              exit 1
            }
          else
            echo "::warning::OPPA_ANDROID_CERT_SHA256 is not set; the signing certificate was not pinned."
          fi

      - name: Upload APK and update manifest to the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="$(node -p "require('./apps/oppa/src-tauri/tauri.conf.json').version")"
          tag="oppa-v${version}"
          name="OPPA_${version}_android_universal.apk"
          cp apps/oppa/src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release.apk "${RUNNER_TEMP}/${name}"
          OPPA_VERSION="${version}" OPPA_RELEASE_TAG="${tag}" OPPA_APK_NAME="${name}" \
            node .github/scripts/android-update-manifest.mjs "${RUNNER_TEMP}/${name}" "${RUNNER_TEMP}/latest-android.json"
          gh release upload "${tag}" "${RUNNER_TEMP}/${name}" "${RUNNER_TEMP}/latest-android.json" --clobber

      - name: Remove signing material
        if: always()
        run: rm -rf "${RUNNER_TEMP}/oppa-android-signing"

  checksums:
    name: Finalize stable release
    needs: [release, android]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Generate and upload SHA256SUMS.txt
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          release_tag="oppa-v$(node -p "require('./apps/oppa/src-tauri/tauri.conf.json').version")"
          asset_directory="${RUNNER_TEMP}/oppa-release-assets"
          checksum_file="${RUNNER_TEMP}/SHA256SUMS.txt"

          mkdir -p "${asset_directory}"
          gh release download "${release_tag}" --dir "${asset_directory}"

          find "${asset_directory}" \
            -maxdepth 1 \
            -type f \
            ! -name '*.sig' \
            ! -name 'latest.json' \
            ! -name 'latest-android.json' \
            ! -name 'SHA256SUMS.txt' \
            -print0 |
            LC_ALL=C sort -z |
            while IFS= read -r -d '' asset; do
              checksum="$(sha256sum "${asset}" | cut -d ' ' -f 1)"
              printf '%s  %s\n' "${checksum}" "$(basename "${asset}")"
            done >"${checksum_file}"

          test -s "${checksum_file}"
          gh release upload "${release_tag}" "${checksum_file}" --clobber

      - name: Publish latest stable release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          release_tag="oppa-v$(node -p "require('./apps/oppa/src-tauri/tauri.conf.json').version")"
          gh release edit "${release_tag}" \
            --draft=false \
            --prerelease=false \
            --latest
