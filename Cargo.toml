[workspace]
members = [
  "apps/oppa/src-tauri",
  "crates/oppa-agent",
  "crates/oppa-auth",
  "crates/oppa-core",
  "crates/oppa-discovery",
  "crates/oppa-platform",
  "crates/oppa-printer",
  "crates/oppa-product",
  "crates/oppa-protocol",
  "crates/oppa-renderer",
  "crates/oppa-spooler",
  "crates/oppa-storage",
  "crates/oppa-transport",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
version = "0.1.0"
authors = ["Neplex <info@neplextech.com>"]
repository = "https://github.com/neplextech/oppa"
rust-version = "1.85"

[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
futures-util = "0.3"
http = "1"
keyring = "3"
rand = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
secrecy = { version = "0.10", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["chrono", "runtime-tokio", "sqlite", "uuid"] }
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = [
  "fs",
  "io-util",
  "macros",
  "net",
  "process",
  "rt-multi-thread",
  "signal",
  "sync",
  "time",
] }
tokio-tungstenite = { version = "0.28", default-features = false, features = [
  "connect",
  "handshake",
  "rustls-tls-webpki-roots",
  "url",
] }
tracing = "0.1"
url = { version = "2", features = ["serde"] }
uuid = { version = "1", features = ["serde", "v4"] }
zeroize = { version = "1", features = ["derive"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"

[profile.release]
lto = true
opt-level = "s"
strip = true
